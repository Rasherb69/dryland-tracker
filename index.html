<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dry-Land Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  :root{
    --stone:#EDEEE9;
    --surface:#FFFFFF;
    --surface-soft:#F5F6F2;
    --ink:#1B2A2E;
    --ink-soft:#55635F;
    --teal:#14524C;
    --teal-soft:#3E7A72;
    --buoy:#C1592E;
    --buoy-soft:#E3AA8E;
    --line:#D8D9D1;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stone:#101917;
      --surface:#172321;
      --surface-soft:#1C2926;
      --ink:#E8EDE9;
      --ink-soft:#9FB0AA;
      --teal:#5CB6AA;
      --teal-soft:#4A9086;
      --buoy:#E38152;
      --buoy-soft:#8A4A2E;
      --line:#2A3633;
    }
  }
  :root[data-theme="dark"]{
    --stone:#101917;
    --surface:#172321;
    --surface-soft:#1C2926;
    --ink:#E8EDE9;
    --ink-soft:#9FB0AA;
    --teal:#5CB6AA;
    --teal-soft:#4A9086;
    --buoy:#E38152;
    --buoy-soft:#8A4A2E;
    --line:#2A3633;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--stone);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:1rem 0.85rem 4rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
    min-height:100vh;
  }

  h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;color:var(--ink);}
  h1{font-size:1.55rem;}
  h2{font-size:1.2rem;}
  h3{font-size:1rem;}
  p{margin:0;color:var(--ink);}
  p.soft{color:var(--ink-soft);}
  p.small{font-size:0.8rem;}
  .eyebrow{
    font-family:var(--sans);
    font-size:0.68rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--teal-soft);
    font-weight:700;
  }

  /* ---- Person switcher ---- */
  .switcher{
    position:sticky;top:0;z-index:5;
    display:flex;gap:0.5rem;
    background:var(--stone);
    padding:0.6rem 0 0.4rem;
  }
  .switch-btn{
    flex:1;
    min-height:46px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
  }
  .switch-btn.active{
    background:var(--teal);
    border-color:var(--teal);
    color:var(--stone);
  }

  /* ---- Tabs ---- */
  .tabs{
    display:flex;
    gap:0.4rem;
    overflow-x:auto;
    padding-bottom:0.2rem;
  }
  .tab-btn{
    flex:0 0 auto;
    min-height:44px;
    padding:0 0.9rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-weight:600;
    font-size:0.86rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--stone);
  }

  .content{display:flex;flex-direction:column;gap:1rem;}

  /* ---- Generic card / button ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:1rem;
    display:flex;
    flex-direction:column;
    gap:0.75rem;
  }
  .btn{
    min-height:44px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:600;
    font-size:0.92rem;
    padding:0 1rem;
    cursor:pointer;
  }
  .btn.primary{background:var(--teal);border-color:var(--teal);color:var(--stone);}
  .btn.danger{background:var(--buoy);border-color:var(--buoy);color:var(--stone);}
  .btn.ghost{background:transparent;}
  .btn.big{width:100%;font-size:1rem;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-row{display:flex;gap:0.6rem;flex-wrap:wrap;}

  .field-row{display:flex;gap:0.6rem;flex-wrap:wrap;}
  .field-row label{
    display:flex;flex-direction:column;gap:0.3rem;
    font-size:0.78rem;color:var(--ink-soft);
    flex:1;min-width:130px;
  }
  input[type="date"],select,textarea{
    min-height:44px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-soft);
    color:var(--ink);
    font-family:var(--sans);
    font-size:0.95rem;
    padding:0 0.6rem;
  }
  textarea{min-height:70px;padding:0.5rem 0.6rem;resize:vertical;font-family:var(--sans);width:100%;}

  /* ---- Exercise editor ---- */
  .exercise-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0.8rem;
    display:flex;flex-direction:column;gap:0.6rem;
  }
  .exercise-card.skipped{opacity:0.55;}
  .exercise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:0.6rem;}
  .exercise-head .titles{display:flex;flex-direction:column;gap:0.15rem;}
  .exercise-meta{font-size:0.76rem;color:var(--ink-soft);font-family:var(--mono);}

  .set-row{
    display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;
    padding:0.4rem 0;
    border-top:1px dashed var(--line);
  }
  .set-row:first-of-type{border-top:none;}
  .set-num{font-size:0.78rem;color:var(--ink-soft);width:3.4rem;flex:0 0 auto;}
  .stepper{display:flex;align-items:center;gap:0.3rem;}
  .stepper button{
    min-width:44px;min-height:44px;
    border-radius:8px;border:1px solid var(--line);
    background:var(--surface-soft);color:var(--ink);
    font-size:1.1rem;font-weight:700;cursor:pointer;
  }
  .num-input{
    width:4.2rem;min-height:44px;text-align:center;
    border-radius:8px;border:1px solid var(--line);
    background:var(--surface-soft);color:var(--ink);
    font-family:var(--mono);font-size:1rem;
    font-variant-numeric:tabular-nums;
  }
  .unit{font-size:0.72rem;color:var(--ink-soft);}
  .icon-btn{
    min-width:44px;min-height:44px;
    border-radius:8px;border:1px solid var(--line);
    background:var(--surface-soft);color:var(--buoy);
    font-size:1rem;cursor:pointer;
  }
  .checkbox-row{display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;}
  .checkbox-row input{width:20px;height:20px;}

  /* ---- History ---- */
  .history-item{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:0.8rem;display:flex;flex-direction:column;gap:0.5rem;
  }
  .history-head{display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem;}
  .history-head .date{font-weight:700;}
  .history-head .day-tag{font-family:var(--mono);color:var(--buoy);font-weight:700;}
  .history-lines{font-size:0.85rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:0.2rem;}
  .history-actions{display:flex;gap:0.5rem;}
  .deload-tag{
    display:inline-block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--surface-soft);border:1px solid var(--line);color:var(--ink-soft);
    padding:0.1rem 0.4rem;border-radius:999px;width:fit-content;
  }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--teal-soft);
    outline-offset:2px;
  }

  /* ---- Dashboard ---- */
  .banner{
    border-left:3px solid var(--teal);
    background:var(--surface);border-radius:0 10px 10px 0;
    padding:0.9rem 1rem;display:flex;flex-direction:column;gap:0.35rem;
  }
  .banner.warn{border-left-color:var(--buoy);}
  .banner strong{font-family:var(--serif);font-size:1.1rem;}
  .banner p{font-size:0.85rem;color:var(--ink-soft);}

  .nudge{
    background:var(--surface-soft);border:1px solid var(--line);border-radius:8px;
    padding:0.6rem 0.8rem;font-size:0.85rem;color:var(--ink-soft);
  }
  .nudge.warn{border-color:var(--buoy);color:var(--buoy);}

  .lift-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;}
  @media (min-width:520px){ .lift-grid{grid-template-columns:1fr 1fr;} }
  .lift-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:0.85rem;display:flex;flex-direction:column;gap:0.5rem;
  }
  .lift-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;}
  .pill{
    font-size:0.65rem;padding:0.2rem 0.5rem;border-radius:999px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;flex:0 0 auto;
  }
  .pill.progressing{background:var(--teal);color:var(--stone);}
  .pill.stalled{background:var(--buoy);color:var(--stone);}
  .pill.building{background:var(--surface-soft);color:var(--ink-soft);border:1px solid var(--line);}
  .lift-stats{display:flex;gap:1rem;}
  .lift-stats > div{display:flex;flex-direction:column;gap:0.1rem;}
  .lift-stat-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .lift-stat-value{font-family:var(--mono);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;}
  .spark{width:100%;height:56px;display:block;}
  .spark-empty{font-size:0.8rem;color:var(--ink-soft);padding:1rem 0;text-align:center;}
  .cue{font-size:0.84rem;}
  .cue.good{color:var(--teal-soft);font-weight:700;}
  .cue.neutral{color:var(--ink-soft);}

  .consistency-row{display:flex;gap:0.35rem;align-items:flex-end;height:70px;}
  .week-bar{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    height:100%;gap:0.25rem;
  }
  .bar-fill{width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--line);min-height:3px;}
  .week-count{font-size:0.68rem;color:var(--ink-soft);font-family:var(--mono);}

  .empty-state{text-align:center;align-items:center;text-align:center;padding:2rem 1rem;}

  .confirm-row{
    display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;
    background:var(--surface-soft);border:1px solid var(--buoy);border-radius:8px;padding:0.5rem;
  }
  .confirm-row span{font-size:0.85rem;color:var(--ink);}

  .msg{border-radius:8px;padding:0.6rem 0.8rem;font-size:0.85rem;}
  .msg.success{background:var(--surface-soft);border:1px solid var(--teal);color:var(--teal-soft);}
  .msg.warn{background:var(--surface-soft);border:1px solid var(--buoy);color:var(--buoy);}

  footer.note{font-size:0.78rem;color:var(--ink-soft);text-align:center;padding-top:0.5rem;}


  /* ---- Plan tab ---- */
  .rope{border:none;border-top:1px dashed var(--line);margin:0;}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:0.35rem;}
  .week-cell{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:0.5rem 0.2rem;text-align:center;display:flex;flex-direction:column;gap:0.2rem;
  }
  .week-cell .day{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .week-cell .tag{font-family:var(--mono);font-size:0.8rem;font-weight:700;}
  .week-cell.strength .tag{color:var(--buoy);}
  .week-cell.flex .tag{color:var(--teal-soft);font-size:0.58rem;font-weight:600;}
  .week-note{font-size:0.82rem;color:var(--ink-soft);margin:0;}

  ul.plan-list{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:0.5rem;}
  ul.plan-list li{color:var(--ink);font-size:0.9rem;}
  ul.plan-list li::marker{color:var(--buoy);}

  .day-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .day-head{display:flex;align-items:baseline;gap:0.8rem;padding:0.9rem 1rem;border-bottom:1px solid var(--line);background:var(--surface-soft);}
  .day-letter{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--buoy);line-height:1;}
  .day-focus{display:flex;flex-direction:column;gap:0.1rem;}
  .day-focus .name{font-weight:700;font-size:0.92rem;}
  .day-focus .tagline{font-size:0.8rem;color:var(--ink-soft);}

  .table-wrap{overflow-x:auto;}
  .plan-table{width:100%;border-collapse:collapse;font-size:0.82rem;min-width:560px;}
  .plan-table th{text-align:left;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);padding:0.6rem 0.8rem 0.4rem;font-weight:700;}
  .plan-table th.pic-col{width:48px;padding:0.6rem 0.3rem 0.4rem 0.8rem;}
  .plan-table td{padding:0.55rem 0.8rem;border-top:1px solid var(--line);vertical-align:top;}
  .plan-table td.pic{width:48px;padding:0.5rem 0.3rem 0.5rem 0.8rem;}
  .pictogram{display:block;border-radius:8px;border:1px solid var(--line);background:#fff;}
  .plan-table td.exercise{font-weight:600;}
  .muscle-line{font-family:var(--sans);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600;margin-top:0.2rem;}
  .plan-table td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .plan-table td.notes{color:var(--ink-soft);font-size:0.78rem;}
  .flag{color:var(--buoy);font-weight:700;}
  .legend{font-size:0.76rem;color:var(--ink-soft);padding:0 1rem 0.9rem;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .callout{border-left:3px solid var(--teal);background:var(--surface);border-radius:0 8px 8px 0;padding:0.9rem 1rem;display:flex;flex-direction:column;gap:0.5rem;}
  .callout.warn{border-left-color:var(--buoy);}
  .callout h3{font-size:0.98rem;}
  .callout p{font-size:0.88rem;color:var(--ink);}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:0.6rem;}
  .stat{background:var(--surface-soft);border:1px solid var(--line);border-radius:8px;padding:0.75rem 0.85rem;display:flex;flex-direction:column;gap:0.25rem;}
  .stat .label{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .stat .value{font-family:var(--mono);font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .sub{font-size:0.74rem;color:var(--ink-soft);}

  /* ---- PR / lifetime bests ---- */
  .pr-badge{
    display:inline-block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--teal);color:var(--stone);font-weight:700;
    padding:0.1rem 0.4rem;border-radius:999px;width:fit-content;
  }
  .msg .pr-line{margin-top:0.3rem;font-weight:600;}
  .bests-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:0.75rem;flex-wrap:wrap;
    padding:0.5rem 0;border-top:1px dashed var(--line);
  }
  .bests-row:first-of-type{border-top:none;}
  .bests-name{font-weight:700;font-size:0.9rem;flex:1 1 100px;}
  .bests-stats{display:flex;gap:1rem;flex-wrap:wrap;}
  .bests-stats > div{display:flex;flex-direction:column;gap:0.1rem;}

  /* ---- Session feel ---- */
  .feel-row{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .feel-btn{
    flex:1;min-width:90px;min-height:44px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface-soft);color:var(--ink-soft);font-family:var(--sans);font-weight:600;
    font-size:0.85rem;cursor:pointer;
  }
  .feel-btn.active{background:var(--teal);border-color:var(--teal);color:var(--stone);}
  .feel-chip{
    display:inline-block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;
    border:1px solid var(--line);color:var(--ink-soft);padding:0.1rem 0.4rem;border-radius:999px;
    width:fit-content;
  }
  .feel-chip.strong{border-color:var(--teal);color:var(--teal-soft);}
  .feel-chip.hard{border-color:var(--buoy);color:var(--buoy);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>

  /* ---------------- store ---------------- */

  function loadStore(){
    var raw;

    if (!raw) return defaultStore();
    try{
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || !parsed.profiles) throw new Error("bad shape");
      if (!parsed.profiles.lewis || !Array.isArray(parsed.profiles.lewis.sessions)){
        try { localStorage.setItem(STORAGE_KEY + "-corrupt", raw); } catch(e2){}
        parsed.profiles.lewis = { sessions:[] };
      }
      if (!parsed.profiles.andrea || !Array.isArray(parsed.profiles.andrea.sessions)){
        try { localStorage.setItem(STORAGE_KEY + "-corrupt", raw); } catch(e2){}
        parsed.profiles.andrea = { sessions:[] };
      }
      parsed.version = 1;
      if (typeof parsed.lastExport !== "string") parsed.lastExport = null;
      return parsed;
    } catch(e){
      try { localStorage.setItem(CORRUPT_KEY, raw); } catch(e2){}
      return defaultStore();
    }

  /* ---------------- helpers ---------------- */
  function pad2(n){ return n<10 ? "0"+n : ""+n; }

  function fmtDate(iso){

  function genId(){

  function clamp(v, min){ return v < min ? min : v; }
  function roundHalf(v){ return Math.round(v*2)/2; }
  function e1rm(weight, reps){ return weight * (1 + reps/30); }

  function personSessions(person){ return store.profiles[person].sessions; }

  /* ---------------- draft logic ---------------- */
  function findLastEntry(person, day, exId){
    var sessions = personSessions(person).filter(function(s){ return s.day === day; });
    sessions.sort(function(a,b){ return b.date.localeCompare(a.date); });
    for (var i=0;i<sessions.length;i++){
      var entry = sessions[i].entries.find(function(e){ return e.exercise === exId; });
      if (entry) return entry;
    }
    return null;
  }
  function defaultSets(ex){
    var out = [];
    for (var i=0;i<ex.sets;i++){ out.push({ weight:0, reps: ex.repLow || 0 }); }
    return out;
  }
  function buildDraftForDay(person, day, date){
    var items = CATALOGUE[day].exercises.map(function(ex){
      var prev = findLastEntry(person, day, ex.id);
      var sets = prev ? prev.sets.map(function(s){ return { weight:s.weight, reps:s.reps }; }) : defaultSets(ex);
      return { exerciseId: ex.id, skipped:false, sets: sets };
    });
    return { id:null, date: date || todayISO(), day: day, notes:"", deload:false, feel:null, items: items };
  }
  function sessionToDraft(session){
    var items = CATALOGUE[session.day].exercises.map(function(ex){
      var entry = session.entries.find(function(e){ return e.exercise === ex.id; });
      if (entry) return { exerciseId: ex.id, skipped:false, sets: entry.sets.map(function(s){ return {weight:s.weight, reps:s.reps}; }) };
      return { exerciseId: ex.id, skipped:true, sets: defaultSets(ex) };
    });
    var validFeel = (session.feel === "strong" || session.feel === "normal" || session.feel === "hard") ? session.feel : null;
    return { id: session.id, date: session.date, day: session.day, notes: session.notes || "", deload: !!session.deload, feel: validFeel, items: items };
  }
  function draftToSession(draft){
    var entries = [];
    draft.items.forEach(function(it){
      if (it.skipped) return;
      if (!it.sets || it.sets.length === 0) return;
      entries.push({ exercise: it.exerciseId, sets: it.sets.map(function(s){ return { weight:Number(s.weight)||0, reps:Number(s.reps)||0 }; }) });
    });
    var out = {
      id: draft.id || genId(),
      date: draft.date,
      day: draft.day,
      entries: entries,
      notes: draft.notes || "",
      deload: !!draft.deload
    };
    if (draft.feel === "strong" || draft.feel === "normal" || draft.feel === "hard") out.feel = draft.feel;
    return out;
  }

  /* ---------------- analysis ---------------- */
  function liftSeries(person, exId){
    var sessions = personSessions(person).filter(function(s){
      return s.entries.some(function(e){ return e.exercise === exId; });
    });
    var series = sessions.map(function(s){
      var entry = s.entries.find(function(e){ return e.exercise === exId; });
      var best = 0;
      entry.sets.forEach(function(set){ var v = e1rm(set.weight, set.reps); if (v > best) best = v; });
      return { date: s.date, e1rm: best, entry: entry };
    });
    series.sort(function(a,b){ return a.date.localeCompare(b.date); });
    return series;
  }
  function liftStatus(person, exId){
    var series = liftSeries(person, exId);
    if (series.length < 3) return { status:"building", label:"Building baseline" };
    var latest = series[series.length-1];
    var latestDate = new Date(latest.date+"T00:00:00");
    var cutoff = new Date(latestDate.getTime() - 42*86400000);
    var baseline = null;
    for (var i=series.length-1;i>=0;i--){
      if (new Date(series[i].date+"T00:00:00") <= cutoff){ baseline = series[i]; break; }
    }
    if (!baseline) baseline = series[0];
    if (latest.e1rm > baseline.e1rm) return { status:"progressing", label:"Progressing" };
    return { status:"stalled", label:"Stalled" };
  }
  function progressionCue(person, day, exId){
    var ex = getExerciseMeta(day, exId);
    var series = liftSeries(person, exId);
    if (series.length === 0) return { text:"Log a session to get a cue", tone:"neutral" };
    var last = series[series.length-1];
    var total = last.entry.sets.length;
    var atTop = last.entry.sets.filter(function(s){ return s.reps >= ex.repHigh; }).length;
    if (total > 0 && atTop === total){
      return { text:"Add weight next session (+2.5 kg)", tone:"good" };
    }
    return { text:"Build reps: " + atTop + " of " + total + " sets at top of range", tone:"neutral" };
  }
  function currentWorkingWeight(series){
    if (!series.length) return null;
    var last = series[series.length-1];
    var weights = last.entry.sets.map(function(s){ return s.weight; });
    return Math.max.apply(null, weights);
  }
  function bestE1RM(series){
    if (!series.length) return null;
    var vals = series.map(function(s){ return s.e1rm; });
    return Math.max.apply(null, vals);
  }
  /* Chronological order used for PR / "last N sessions" comparisons: by date,
     then by position in the stored array on a date tie (ties broken by array
     index rather than re-sorted, since edits keep a session's original slot). */
  function sortedSessionsChron(person){
    return personSessions(person)
      .map(function(s, idx){ return { s:s, idx:idx }; })
      .sort(function(a,b){
        if (a.s.date !== b.s.date) return a.s.date < b.s.date ? -1 : 1;
        return a.idx - b.idx;
      })
      .map(function(x){ return x.s; });
  }

  /* Weight PR: a set's weight exceeds every weight logged for that exercise in
     a strictly earlier session (earlier by date, and on a date tie, earlier in
     the stored array). e1RM PR: same rule, on Epley e1RM of each set. Sets with
     weight 0 are ignored on both sides of the comparison. A session with no
     strictly-earlier data for an exercise is treated as a baseline, not a PR -
     "heaviest yet" needs a "yet" to compare against. */
  function computeSessionPRs(person, targetSession){
    var list = personSessions(person);
    var targetIndex = list.findIndex(function(s){ return s.id === targetSession.id; });
    if (targetIndex === -1) return [];
    var prs = [];
    targetSession.entries.forEach(function(entry){
      var priorWeights = [], priorE1s = [];
      list.forEach(function(s, idx){
        if (s.id === targetSession.id) return;
        var earlier = (s.date < targetSession.date) || (s.date === targetSession.date && idx < targetIndex);
        if (!earlier) return;
        var oe = s.entries.find(function(e){ return e.exercise === entry.exercise; });
        if (!oe) return;
        oe.sets.forEach(function(set){
          if (set.weight > 0){
            priorWeights.push(set.weight);
            priorE1s.push(e1rm(set.weight, set.reps));
          }
        });
      });
      var bestWeight = 0, bestReps = 0, bestE1 = 0;
      entry.sets.forEach(function(set){
        if (set.weight <= 0) return;
        if (set.weight > bestWeight){ bestWeight = set.weight; bestReps = set.reps; }
        var v = e1rm(set.weight, set.reps);
        if (v > bestE1) bestE1 = v;
      });
      if (bestWeight <= 0) return;
      var isWeightPR = priorWeights.length > 0 && bestWeight > Math.max.apply(null, priorWeights);
      var isE1rmPR = priorE1s.length > 0 && bestE1 > Math.max.apply(null, priorE1s);
      if (isWeightPR || isE1rmPR){
        prs.push({ exercise: entry.exercise, weight: bestWeight, reps: bestReps, e1rm: bestE1, isWeightPR: isWeightPR, isE1rmPR: isE1rmPR });
      }
    });
    return prs;
  }

  function formatPRLine(pr, person){
    var found = findExerciseMetaAnyDay(pr.exercise);
    var name = found ? exName(found.ex, person) : pr.exercise;
    if (pr.isWeightPR && pr.isE1rmPR){
      return "PR: " + name + " " + pr.weight + " kg (heaviest yet, best e1RM)";
    }
    if (pr.isWeightPR){
      return "PR: " + name + " " + pr.weight + " kg (heaviest yet)";
    }
    return "PR: " + name + " " + Math.round(pr.e1rm) + " kg e1RM (best e1RM)";
  }

  /* Lifetime best weight-set and best e1RM for one exercise, each with the date it happened. */
  function lifetimeBest(person, exId){
    var sessions = personSessions(person).filter(function(s){
      return s.entries.some(function(e){ return e.exercise === exId; });
    });
    var bestWeight = null, bestE1 = null;
    sessions.forEach(function(s){
      var entry = s.entries.find(function(e){ return e.exercise === exId; });
      entry.sets.forEach(function(set){
        if (set.weight <= 0) return;
        if (!bestWeight || set.weight > bestWeight.weight){ bestWeight = { weight:set.weight, reps:set.reps, date:s.date }; }
        var v = e1rm(set.weight, set.reps);
        if (!bestE1 || v > bestE1.value){ bestE1 = { value:v, weight:set.weight, reps:set.reps, date:s.date }; }
      });
    });
    return { bestWeight: bestWeight, bestE1: bestE1 };
  }

  function computeBanner(person){
    var lifts = PRIMARY_LIFTS.map(function(pl){
      var ex = getExerciseMeta(pl.day, pl.id);
      var st = liftStatus(person, pl.id);
      return { name: exName(ex, person), status: st.status, label: st.label };
    });
    var stalled = lifts.filter(function(l){ return l.status === "stalled"; });
    if (stalled.length === 0){
      return { tone:"good", text:"On track", detail:"Every primary lift is progressing or still building baseline data." };
    }
    var names = stalled.map(function(l){ return l.name; }).join(", ");
    var plural = stalled.length > 1 ? "these lifts" : "this lift";
    var detail = "No e1RM improvement over the trailing 6 weeks on " + plural + ". Check sleep and recovery, and consider scheduling a deload.";
    var lastThree = sortedSessionsChron(person).slice(-3);
    var hardCount = lastThree.filter(function(s){ return s.feel === "hard"; }).length;
    if (hardCount >= 2){
      detail += " Recent sessions have felt hard going - this reads as a recovery problem, not a programming one. Consider bringing the deload forward.";
    }
    return { tone:"warn", text:"Stalled: " + names, detail:detail };
  }
  function weekBuckets(person){
    var sessions = personSessions(person);
    var now = new Date(); now.setHours(0,0,0,0);
    var dow = now.getDay();
    var diffToMonday = (dow === 0) ? -6 : (1 - dow);
    var thisMonday = new Date(now); thisMonday.setDate(now.getDate() + diffToMonday);
    var weeks = [];
    for (var w=7; w>=0; w--){
      var start = new Date(thisMonday); start.setDate(thisMonday.getDate() - w*7);
      var end = new Date(start); end.setDate(start.getDate()+6);
      var count = sessions.filter(function(s){
        var d = new Date(s.date+"T00:00:00");
        return d >= start && d <= end;
      }).length;
      weeks.push({ start:start, count:count });
    }
    return weeks;
  }
  function deloadWeeksDue(person){
    var sessions = personSessions(person);
    if (sessions.length === 0) return null;
    var sorted = sessions.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var firstDate = sorted[0].date;
    var deloads = sessions.filter(function(s){ return s.deload; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
    var anchor = deloads.length ? deloads[0].date : firstDate;
    var anchorDate = new Date(anchor+"T00:00:00");
    var now = new Date(); now.setHours(0,0,0,0);
    return (now - anchorDate) / (7*86400000);
  }

  }

  /* ---------------- render: history ---------------- */
  function summaryLineForSession(session, person){
    var primary = PRIMARY_LIFTS.filter(function(p){ return p.day === session.day; });
    var parts = [];
    primary.forEach(function(p){
      var entry = session.entries.find(function(e){ return e.exercise === p.id; });
      if (!entry || !entry.sets.length) return;
      var best = entry.sets.reduce(function(a,b){ return (b.weight>a.weight)?b:a; }, entry.sets[0]);
      var ex = getExerciseMeta(p.day, p.id);
      parts.push(exName(ex, person) + ": " + best.weight + "kg x " + best.reps);
    });
    return parts;
  }

  /* ---------------- render: dashboard ---------------- */
  function sparkline(series){
    if (series.length === 0) return '<div class="spark-empty">No data yet</div>';
    var w=200, h=56, pad=6;
    if (series.length === 1){
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="spark" preserveAspectRatio="none">'
        + '<circle cx="' + (w/2) + '" cy="' + (h/2) + '" r="4" fill="var(--teal)"></circle></svg>';
    }
    var vals = series.map(function(s){ return s.e1rm; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 1;
    var pts = series.map(function(p, i){
      var x = pad + (i/(series.length-1)) * (w - 2*pad);
      var y = (h - pad) - ((p.e1rm - min) / range) * (h - 2*pad);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="spark" preserveAspectRatio="none">'
      + '<polyline points="' + pts + '" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
      + '</svg>';
  }

  /* ---------------- top-level render ---------------- */
  function render(){
    var root = document.getElementById("app");
    root.innerHTML = renderPersonSwitcher() + renderTabs()
      + '<main class="content">' + (
        ui.view === "log" ? renderLog() :

  /* ---------------- mutations ---------------- */
  function findItem(itemIdx){ return ui.draft.items[itemIdx]; }

  function persistAndSwitch(session){
    var list = personSessions(ui.person);
    var idx = list.findIndex(function(s){ return s.id === session.id; });
    if (idx >= 0) list[idx] = session; else list.push(session);
    saveStore();
    var prs = computeSessionPRs(ui.person, session);
    ui.saveConfirmation = { person: ui.person, sessionId: session.id, prs: prs };
    ui.draft = null;
    ui.view = "dashboard";
  }

  function mergeImport(imported){
    var counts = { lewis:0, andrea:0 };
    ["lewis","andrea"].forEach(function(person){
      var existing = personSessions(person);
      var map = {};
      existing.forEach(function(s){ map[s.id] = s; });
      var before = Object.keys(map).length;
      (imported.profiles[person].sessions || []).forEach(function(s){
        if (s && s.id && s.date && (s.day === "A" || s.day === "B" || s.day === "C") && Array.isArray(s.entries)){
          if (s.feel !== "strong" && s.feel !== "normal" && s.feel !== "hard") delete s.feel;
          map[s.id] = s;
        }
      });
      var merged = Object.keys(map).map(function(k){ return map[k]; });
      merged.sort(function(a,b){ return a.date.localeCompare(b.date); });
      store.profiles[person].sessions = merged;
      counts[person] = merged.length - before;
    });
    return counts;
  }

  function validateImportShape(obj){
    return !!(obj && typeof obj === "object" && obj.profiles
      && obj.profiles.lewis && Array.isArray(obj.profiles.lewis.sessions)
      && obj.profiles.andrea && Array.isArray(obj.profiles.andrea.sessions));
  }

  function canWebDownload(){
    try {
      return typeof Blob !== "undefined" && typeof URL !== "undefined"
        && typeof URL.createObjectURL === "function"
        && "download" in document.createElement("a");
    } catch (e){ return false; }
  }

  function handleExportWeb(){
    var filename = "dryland-tracker-backup-" + todayISO() + ".json";
    var data = JSON.stringify(store, null, 2);
    try {
      var blob = new Blob([data], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      store.lastExport = new Date().toISOString();
      saveStore();
      ui.exportMessage = { type:"success", text:"Backup saved to your downloads." };
      ui.exportFallback = null;
    } catch (e){
      ui.exportFallback = data;
      ui.exportMessage = { type:"warn", text:"Couldn't save automatically. Copy the JSON below instead." };
    }
    render();
  }

  function handleExport(){
    if (!downloadsAPI || ui.exporting) return;
    ui.exporting = true;
    ui.exportMessage = null;
    render();
    var filename = "dryland-tracker-backup-" + todayISO() + ".json";
    var data = JSON.stringify(store, null, 2);
    downloadsAPI.save({ filename: filename, data: data }).then(function(res){
      if (res && res.status === "saved"){
        store.lastExport = new Date().toISOString();
        saveStore();
        ui.exportMessage = { type:"success", text:"Backup saved." };
        ui.exportFallback = null;
      }
      ui.exporting = false;
      render();
    }, function(err){
      var code = err && err.code;
      if (code === "declined"){
        ui.exportMessage = null;
      } else if (code === "rate_limited"){
        ui.exportMessage = { type:"warn", text:"A save prompt is already open. Wait a moment and try again." };
      } else {
        ui.exportFallback = data;
        ui.exportMessage = { type:"warn", text:"Couldn't save automatically. Copy the JSON below instead." };
      }
      ui.exporting = false;
      render();
    });
  }

  function handleImport(){
    var ta = document.getElementById("import-textarea");
    var raw = ta ? ta.value.trim() : "";
    if (!raw){
      ui.importMessage = { type:"warn", text:"Paste a JSON backup first." };
      render();
      return;
    }
    var parsed;
    try { parsed = JSON.parse(raw); } catch(e){
      ui.importMessage = { type:"warn", text:"That doesn't look like valid JSON." };
      render();
      return;
    }
    if (!validateImportShape(parsed)){
      ui.importMessage = { type:"warn", text:"That JSON doesn't match the expected backup shape." };
      render();
      return;
    }
    var counts = mergeImport(parsed);
    saveStore();
    ui.importMessage = { type:"success", text:"Imported. Lewis +" + counts.lewis + ", Andrea +" + counts.andrea + " session(s) net." };
    render();
  }

  /* ---------------- event delegation ---------------- */
  var root = document.getElementById("app");

  root.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;

    if (action === "switch-person"){
      var p = btn.dataset.person;
      if (p === ui.person) return;
      if (ui.draft){
        ui.pendingConfirm = { type:"switch-person", person:p };
        render();
        return;
      }
      ui.person = p;
      ui.view = "log";
      ui.pendingConfirm = null;
      ui.saveConfirmation = null;
      render();
      return;
    }

    if (action === "set-view"){
      ui.view = btn.dataset.view;
      ui.pendingConfirm = null;
      if (ui.view !== "dashboard") ui.saveConfirmation = null;
      render();
      return;
    }

    if (action === "start-session"){
      var dateEl = document.getElementById("new-session-date");
      var dayEl = document.getElementById("new-session-day");
      var date = (dateEl && dateEl.value) ? dateEl.value : todayISO();
      var day = (dayEl && dayEl.value) ? dayEl.value : "A";
      ui.draft = buildDraftForDay(ui.person, day, date);
      render();
      return;
    }

    if (action === "toggle-skip"){
      var it = findItem(Number(btn.dataset.item));
      it.skipped = !it.skipped;
      render();
      return;
    }

    if (action === "add-set"){
      var it2 = findItem(Number(btn.dataset.item));
      var lastSet = it2.sets.length ? it2.sets[it2.sets.length-1] : { weight:0, reps:0 };
      it2.sets.push({ weight: lastSet.weight, reps: lastSet.reps });
      render();
      return;
    }

    if (action === "remove-set"){
      var it3 = findItem(Number(btn.dataset.item));
      var si = Number(btn.dataset.set);
      it3.sets.splice(si, 1);
      render();
      return;
    }

    if (action === "inc-weight" || action === "dec-weight"){
      var it4 = findItem(Number(btn.dataset.item));
      var s4 = it4.sets[Number(btn.dataset.set)];
      var delta = action === "inc-weight" ? 2.5 : -2.5;
      s4.weight = clamp(roundHalf(s4.weight + delta), 0);
      render();
      return;
    }

    if (action === "inc-reps" || action === "dec-reps"){
      var it5 = findItem(Number(btn.dataset.item));
      var s5 = it5.sets[Number(btn.dataset.set)];
      var d5 = action === "inc-reps" ? 1 : -1;
      s5.reps = clamp(s5.reps + d5, 0);
      render();
      return;
    }

    if (action === "toggle-deload"){
      return; // handled by change listener
    }

    if (action === "set-feel"){
      ui.draft.feel = btn.dataset.feel;
      render();
      return;
    }

    if (action === "discard-draft"){
      ui.pendingConfirm = { type:"discard-draft" };
      render();
      return;
    }

    if (action === "delete-session"){
      ui.pendingConfirm = { type:"delete-session", id: btn.dataset.id };
      render();
      return;
    }

    if (action === "edit-session"){
      var sess = personSessions(ui.person).find(function(s){ return s.id === btn.dataset.id; });
      if (sess){
        ui.draft = sessionToDraft(sess);
        ui.view = "log";
        render();
      }
      return;
    }

    if (action === "confirm-yes"){
      var pc = ui.pendingConfirm;
      ui.pendingConfirm = null;
      if (!pc) { render(); return; }
      if (pc.type === "discard-draft"){
        ui.draft = null;
      } else if (pc.type === "delete-session"){
        var list = personSessions(ui.person);
        var idx = list.findIndex(function(s){ return s.id === pc.id; });
        if (idx >= 0) list.splice(idx, 1);
        saveStore();
      } else if (pc.type === "switch-person"){
        ui.draft = null;
        ui.person = pc.person;
        ui.view = "log";
        ui.saveConfirmation = null;
      }
      render();
      return;
    }

    if (action === "confirm-no"){
      ui.pendingConfirm = null;
      render();
      return;
    }

    if (action === "save-session"){
      var session = draftToSession(ui.draft);
      persistAndSwitch(session);
      render();
      return;
    }

    if (action === "export-backup-web"){
      handleExportWeb();
      return;
    }

    if (action === "export-backup"){
      handleExport();
      return;
    }

    if (action === "select-export-text"){
      var ta2 = document.getElementById("export-textarea");
      if (ta2){ ta2.focus(); ta2.select(); }
      return;
    }

    if (action === "import-data"){
      handleImport();
      return;
    }
  });

  root.addEventListener("change", function(e){
    var el = e.target;
    if (el.matches("[data-field]")){
      var it = findItem(Number(el.dataset.item));
      var s = it.sets[Number(el.dataset.set)];
      var field = el.dataset.field;
      var val = parseFloat(el.value.replace(",", "."));
      if (isNaN(val) || val < 0) val = s[field];
      s[field] = field === "weight" ? roundHalf(val) : Math.round(val);
      render();
      return;
    }
    if (el.id === "draft-date"){
      ui.draft.date = el.value || todayISO();
      return;
    }
    if (el.id === "draft-notes"){
      ui.draft.notes = el.value;
      return;
    }
    if (el.id === "draft-deload"){
      ui.draft.deload = el.checked;
      return;
    }
  });

  /* ---------------- downloads capability ---------------- */
  function initDownloads(){
    try{
      if (typeof claude !== "undefined" && claude && typeof claude.use === "function"){
        claude.use("downloads").then(function(api){
          downloadsAPI = api || null;
          if (ui.view === "backup") render();
        }, function(){
          downloadsAPI = null;
          if (ui.view === "backup") render();
        });
      }
    } catch(e){
      downloadsAPI = null;
    }
  }

  /* ---------------- offline support (self-hosted only) ---------------- */
  function initServiceWorker(){
    try {
      if ("serviceWorker" in navigator && /\.github\.io$/.test(location.hostname)){
        navigator.serviceWorker.register("sw.js");
      }
    } catch (e){ /* offline caching unavailable; app still works online */ }
  }

  render();
  initDownloads();
  initServiceWorker();
})();
</script>
